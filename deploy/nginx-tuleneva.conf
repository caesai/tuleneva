# Шаблон site Nginx для Tuleneva.
# Установка (один раз): скопировать в /etc/nginx/sites-available/tuleneva,
# включить symlink в sites-enabled, затем:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tuleneva25.ru
#
# Корень статики — symlink current/dist; CD переключает current без reload Nginx.
#
# Certbot дописывает отдельный server { listen 443 ssl }. Эти location нужно
# вставить и туда: CD конфиг Nginx не выкладывает. После правки живого файла:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name tuleneva25.ru;

    root /var/www/tuleneva/current/dist;
    index index.html;

    # HTML без кэша. Иначе WKWebView Telegram хранит старый index.html
    # со ссылками на хеши, которые следующий релиз уже удалил из current/dist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Хеши Vite можно держать год. Промах — 404, не index.html:
    # try_files в location / отдал бы HTML с кодом 200, и import() модуля падает в белый экран.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        # Иначе Telegram шлёт обновления, а Express отвечает 401 (секрет не доходит).
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
